# Run from backend root:
# Build: docker compose -f docker-compose.weaviate.yml up -d
# Stop:  docker compose -f docker-compose.weaviate.yml down
services:
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.28.4
    container_name: hybridrag-weaviate
    restart: unless-stopped
    ports:
      - "8081:8080"
      - "50052:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: node1
      LOG_LEVEL: info
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/v1/.well-known/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [ utehy-network ]

networks:
  utehy-network:
    name: utehy-network
    external: true

volumes:
  weaviate_data:
