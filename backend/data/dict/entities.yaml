# UTEHY canonical entity dictionary.
# Grounded in:
#   - backend/data/samples/qa_fb.md
#   - backend/data/samples/tuyen_sinh_247.md
#   - backend/data/samples/Điểm 2023.md / 2024.md / 2025.md
#   - backend/data/samples/Thông báo tuyển sinh đại học chính quy năm 2026.txt
#   - backend/data/samples/wiki.md
#
# Each record:
#   canonical : snake_case key used downstream (filters, metadata)
#   display   : user-facing Vietnamese name
#   aliases   : free-form spelling variants (with/without diacritics, abbreviations, EN)
#   location  : (campus only) physical province/district
#   code      : (major only) Mã ngành from tuyen_sinh_247.md table

