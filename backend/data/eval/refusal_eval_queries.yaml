# Refusal / Grounded / Partial / Handoff evaluation query set.
#
# This file feeds `backend/scripts/eval_refusal_rate.py`. Each entry is one
# turn sent to POST /api/v1/chat/answer. `expected_class` is the human-labelled
# ground truth the script will compare against the auto-classified response.
#
# Design (v2 - expanded for thesis benchmark credibility)
# -------------------------------------------------------
# Total queries : 50
# Domain        : UTEHY (Hung Yen University of Technology & Education) admissions
# Languages     : Vietnamese (primary), some English/code-switching, no-diacritic
#                 typing, and abbreviation variants reflecting real user input.
#
# Category distribution (target == realised)
# ------------------------------------------
# factual_in_corpus : 15  -> expected grounded
# partial_info      : 10  -> expected partial
# off_topic         :  8  -> expected refusal
# typo_or_abbrev    :  8  -> expected grounded
# session_context   :  5  -> expected partial (4) / grounded (1)
# edge_empty        :  4  -> expected refusal
#
# Categories
# ----------
# factual_in_corpus : answer fully covered by ingested docs   -> expect grounded
# partial_info      : partially covered; LLM should hedge      -> expect partial
# off_topic         : outside admissions scope                 -> expect refusal
# typo_or_abbrev    : misspelt / abbreviated but resolvable    -> expect grounded
# session_context   : underspecified; needs slot/context       -> expect partial
# edge_empty        : empty / nonsense / adversarial           -> expect refusal
#
# Classes
# -------
# grounded | partial | refusal | chitchat   (handoff is a sub-class of refusal)
#
# Topic coverage
# --------------
# Nganh dao tao  : CNTT, KTPM, KTDT-VT, KTCK, Dien-Dien tu, Cong nghe O to,
#                  Ke toan, QTKD, Ngon ngu Anh, Su pham Ky thuat, May, Logistics
# Diem chuan     : 2022, 2023, 2024, 2025; xet hoc ba / diem thi THPT / tuyen thang
# Hoc phi        : theo nganh / co so / nam hoc
# Phuong thuc XT : ho so, dieu kien, deadline
# Co so          : Co so 1 (Hung Yen), Co so 2 (Hai Duong)
# Khac           : KTX, hoc bong, hoat dong sinh vien, viec lam sau tot nghiep

