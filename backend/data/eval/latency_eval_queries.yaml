# Latency evaluation query set (v2 - expanded to 50 queries).
#
# Consumed by `backend/scripts/eval_latency.py`. Each entry is one POST to
# /api/v1/chat/answer. Queries are stratified across the retrieval/generation
# paths so the measured p50/p95/p99 reflect a realistic production traffic mix
# rather than a single-path microbenchmark.
#
# Pipeline paths exercised:
#   rewrite -> route -> retrieve -> rerank -> generate
#   off_topic queries early-exit before retrieval (fast-path baseline)
#   session_context queries additionally read prior session_state
#
# Distribution (50 total)
# -----------------------
# short_factual   (15) : <=8 token queries, single-chunk hits, low rerank load
# long_factual    (10) : 15-30 token queries, multi-chunk + heavier rerank
# multi_compare    (8) : cross-nganh / cross-nam / cross-coso comparisons,
#                       stress the reranker and context assembler
# off_topic        (5) : out-of-scope, exercises refusal / chitchat fast path
# typo_abbrev      (7) : misspelt or abbreviated, exercises query rewriter
# session_context  (5) : depend on prior turn; exercises session_state read
#
# Cite in thesis methodology: query mix designed to mirror observed UTEHY
# admissions traffic (Q3-Q4 academic year peak: ~60% short factual,
# ~20% long factual + compare, ~10% typo, ~5% off-topic, ~5% follow-up).
#
# ID scheme: lat_001 ... lat_050 (zero-padded for stable sort order).

