# =====================================================================
# RAGAS golden dataset for HybridRAG (graduation-thesis baseline).
#
# Schema
# ------
#   - id:                 unique short identifier (e.g. q1)
#     question:           user utterance in Vietnamese
#     ground_truth:       reference answer expected from the bot
#     reference_contexts: list of source snippets that should support the answer
#     expected_source:    (optional) source filename for context_recall scoring
#     expected_keywords:  (optional) explicit keyword list for context_precision
#                          / answer_correctness. If omitted, the loader derives
#                          a coarse list from `ground_truth` (see ragas_eval.py).
#     intent / category:  (optional) used for per-intent/per-category breakdowns
#     verify:             (optional) bool. When true, the numeric facts in this
#                          entry are placeholders and MUST be cross-checked
#                          against the official UTEHY admissions documents
#                          before reporting any metric in the thesis.
#
# IMPORTANT - DATA VERIFICATION REQUIRED
# --------------------------------------
# The numeric facts below (cutoff scores, tuition figures, quotas, deadlines,
# hotline numbers, scholarship amounts) are PLACEHOLDERS modeled on the v1
# golden set and the sample corpus under backend/data/samples/. Before reporting
# any metric in the thesis, cross-check every `ground_truth` against the
# official UTEHY admissions documents (Đề án tuyển sinh, Thông báo tuyển sinh,
# v.v.) and update the numbers in this file. Faithfulness / answer_correctness
# scores are only meaningful when the gold facts are correct.
#
# Entries flagged with `verify: true` are the ones whose numeric values
# (or contact / scholarship / policy details) were not directly attested in
# the sample corpus and were reconstructed as plausible placeholders. Treat
# these as TODO items for manual verification before publishing benchmark
# results.
#
# How to run
# ----------
#   cd backend
#   python scripts/ragas_eval.py --input data/eval/ragas_golden.yaml --no-gen
#   python scripts/ragas_eval.py --input data/eval/ragas_golden.yaml \
#       --with-faithfulness         # requires OPENAI_API_KEY
# =====================================================================

