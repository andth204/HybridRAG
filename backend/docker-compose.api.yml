# Run from backend root:
# Build: docker compose --env-file .env -f docker-compose.api.yml up -d --build
# Rebuild: docker compose -f docker-compose.api.yml up -d --build --force-recreate

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: utehy-api
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      POSTGRES_HOST: utehy-postgres
      POSTGRES_PORT: "5432"
      MINIO_ENDPOINT: http://utehy-minio:9000
      KAFKA_BOOTSTRAP_SERVERS: utehy-kafka:29092
      WEAVIATE_URL: http://hybridrag-weaviate:8080
      WEAVIATE_GRPC_HOST: hybridrag-weaviate
      WEAVIATE_GRPC_PORT: "50051"
      RATE_LIMIT_ENABLED: "False"
      METRICS_ENABLED: "True"
    command: python -m uvicorn src.api.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8001:8000"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import socket; s = socket.create_connection(('localhost', 8000), timeout=3); s.close()" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ utehy-network ]

networks:
  utehy-network:
    name: utehy-network
    external: true
