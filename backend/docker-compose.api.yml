# Run from backend root:
# docker compose --env-file .env -f docker-compose.api.yml up -d --build

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: utehy-api
    working_dir: /app
    volumes:
      - .:/app
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      PYTHONPATH: /app
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MINIO_ENDPOINT: http://minio:9000
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    command: python -m uvicorn src.api.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live', timeout=3).read()" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ utehy-network ]

networks:
  utehy-network:
    name: utehy-network
    external: true
