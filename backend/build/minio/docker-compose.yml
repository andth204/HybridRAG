# docker compose --env-file ../../.env up -d
services:
  minio:
    image: minio/minio:latest
    container_name: utehy-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_NOTIFY_KAFKA_ENABLE_PRIMARY: "on"
      MINIO_NOTIFY_KAFKA_BROKERS_PRIMARY: "kafka:29092"
      MINIO_NOTIFY_KAFKA_TOPIC_PRIMARY: "${INDEXING_INPUT_TOPIC}"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks: [ utehy-network ]
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 20

  minio-kafka-setup:
    image: minio/mc:latest
    container_name: utehy-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command: >
      mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} && mc mb --ignore-existing myminio/${MINIO_BUCKET_NAME} && mc event add myminio/${MINIO_BUCKET_NAME} arn:minio:sqs::PRIMARY:kafka --event put,delete && echo "MinIO bucket + event ready"
    restart: "no"
    networks: [ utehy-network ]

networks:
  utehy-network:
    name: utehy-network
    external: true

volumes:
  minio_data:
